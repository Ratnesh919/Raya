[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/nvidia/*"
  to = "https://integrate.api.nvidia.com/v1/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

[[redirects]]
  from = "/api/memory"
  to = "/.netlify/functions/memory"
  status = 200

[[redirects]]
  from = "/api/memory/*"
  to = "/.netlify/functions/memory/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
